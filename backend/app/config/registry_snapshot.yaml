# Snapshot of public product information from the Polish registry of medicinal products
# (Rejestr Produktów Leczniczych, URPL, https://rejestrymedyczne.ezdrowie.gov.pl).
# SIMULATED FOR THE DEMO: values follow the structure of SmPC (ChPL) section 4.8 "Undesirable effects"
# but are abridged excerpts, not a copy of the official documents. A production build would sync this
# from the registry's public data and keep the registry id and version for every fact.
#
# match:   lowercase substrings of the medicine name or ATC code
# effects: SmPC term, frequency group, and plain-language aliases used to match what patients say
source:
  name: Rejestr Produktów Leczniczych (URPL)
  url: https://rejestrymedyczne.ezdrowie.gov.pl/rpl/search/public
  snapshot: "2026-09-30"
  simulated: true

products:
  - id: urpl-methylphenidate
    substance: methylphenidate
    match: [methylphenidate, metylofenidat, concerta, medikinet, "n06ba04"]
    atc: N06BA04
    class: central nervous system stimulant
    registry_id: "RPL-0000001 (demo)"
    effects:
      - { term: decreased appetite, freq: very common, aliases: [appetite, apetyt] }
      - { term: insomnia, freq: very common, aliases: [falling asleep, trouble sleeping, zasypia] }
      - { term: headache, freq: very common, aliases: [headache, bol glowy] }
      - { term: palpitations, freq: common, aliases: [racing heart, kolatanie] }
      - { term: tachycardia, freq: common, aliases: [racing heart] }
      - { term: irritability, freq: common, aliases: [irritab, drazliw] }
      - { term: dry mouth, freq: common, aliases: [dry mouth, sucho w ustach] }
