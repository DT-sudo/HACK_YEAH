# Product-information facts the context engine attaches to medicines (synthetic demo excerpt of
# SmPC "undesirable effects" sections). Used to describe connections, never to draw conclusions.
# match: lowercase substrings of the medicine name / ATC code.
medicines:
  - match: [lisinopril, enalapril, ramipril, perindopril, "c09aa"]
    class: ACE inhibitor
    listed_side_effects: [dry cough, dizziness, headache]
  - match: [atorvastatin, simvastatin, rosuvastatin, "c10aa"]
    class: statin
    listed_side_effects: [muscle pain, headache, nausea]
  - match: [ibuprofen, naproxen, diclofenac, ketoprofen, "m01ae"]
    class: NSAID
    listed_side_effects: [heartburn, stomach pain, nausea, raised blood pressure]
    lab_watch: [creatinine]
  - match: [omeprazole, pantoprazole, esomeprazole, "a02bc"]
    class: proton pump inhibitor
    used_for: [heartburn]
    listed_side_effects: [headache, stomach pain]
  - match: [amoxicillin, "j01ca"]
    class: penicillin antibiotic
    listed_side_effects: [diarrhoea, rash]
  - match: [metoprolol, bisoprolol, "c07ab"]
    class: beta blocker
    listed_side_effects: [tiredness, cold hands, shortness of breath]
  - match: [amlodipine, "c08ca"]
    class: calcium channel blocker
    listed_side_effects: [ankle swelling, headache, flushing]
  - match: [metformin, "a10ba"]
    class: biguanide
    listed_side_effects: [nausea, diarrhoea, stomach pain]
  - match: [creatine]
    class: supplement
    listed_side_effects: [weight gain, muscle cramps]
  - match: [cholecalciferol, "vitamin d"]
    class: supplement
    listed_side_effects: []
