# One command: `docker compose up`  →  app on http://localhost:3000, API on http://localhost:8000
#
# Only `web` and `api` publish ports; PostgreSQL and Redis sit on an internal network. The API seeds
# the synthetic demo data on start and keeps FHIR resources in its built-in FHIR store.
# To run a separate HAPI FHIR server as in ARCHITECTURE.md, add the override file:
#   docker compose -f docker-compose.yml -f docker-compose.hapi.yml up --build
# No real patient data is ever used.
#
# The LLM is Gemini: put VC_GEMINI_API_KEY in a .env file next to this one. Without a key the
# intake falls back to the offline rule engine.
name: vitalcontext

services:
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000  # the browser calls the API through the published port
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      VC_DATABASE_URL: postgresql+psycopg://vitalcontext:vitalcontext@postgres:5432/vitalcontext
      VC_FHIR_BACKEND: local
      VC_REDIS_URL: redis://redis:6379/0
      VC_JWT_SECRET: ${VC_JWT_SECRET:-demo-only-secret-change-me-for-anything-real}
      VC_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      VC_LLM_PROVIDER: ${VC_LLM_PROVIDER:-gemini}
      VC_GEMINI_MODELS: ${VC_GEMINI_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash}
      VC_GEMINI_API_KEY: ${VC_GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 300s  # generous: covers HAPI's first boot when the override file is used
    networks: [internal, edge]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vitalcontext
      POSTGRES_PASSWORD: vitalcontext
      POSTGRES_DB: vitalcontext
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalcontext"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    internal: true  # Postgres, Redis (and HAPI, if enabled) are not reachable from outside
  edge: {}

volumes:
  pgdata: {}
